name: Fix reading images and remove shop music

on:
  push:
    paths:
      - '.github/workflows/fix-reading-remove-music.yml'

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          slides = '''const slides=window.prettyLessonSlides=[
            {src:"assets/images/reading/reading-01-elephant.png",alt:"大象鼻子長"},
            {src:"assets/images/reading/reading-02-hippo.png",alt:"河馬長得壯"},
            {src:"assets/images/reading/reading-03-tiger.png",alt:"老虎毛皮黃"},
            {src:"assets/images/reading/reading-04-butterfly.png",alt:"蝴蝶花衣裳"},
            {src:"assets/images/reading/reading-05-smile.png",alt:"笑一笑好漂亮"}
          ];
          let index=0;'''

          s, n = re.subn(
              r'const slides=window\.prettyLessonSlides=\[.*?\];\nlet index=0;',
              slides,
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 reading slides block, found {n}')

          s, n = re.subn(
              r'\s*<div><div class="shop-music-controls" role="group" aria-label="背景音樂控制">.*?</div><span class="shop-tag">生活小超市</span><h2>購物分一分</h2></div>',
              '\n  <div><span class="shop-tag">生活小超市</span><h2>購物分一分</h2></div>',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 music controls block, found {n}')

          s, n = re.subn(r'\n\s*<audio id="shopMusicAudio"[^>]*></audio>', '', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected 1 shop audio element, found {n}')

          s, n = re.subn(
              r'\n/\* Compact teacher music controls.*?(?=/\* The hint uses the freed side column;)',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 music CSS block, found {n}')

          s, n = re.subn(
              r'/\* Teacher preference stays separate from the temporary narration ducking\. \*/\nconst ShopMusic=\(\(\)=>\{.*?\n\}\)\(\);\n\n(?=const ShopSplit=\(\(\)=>\{)',
              '',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 ShopMusic module, found {n}')

          s = s.replace('ShopMusic.duck();', '')

          old_result = '''   const completedQuestion=question;
   const narration=speakText(question.total+'可以分成'+question.taken+'和'+question.answer+'。',.72,true);
   const resumeAfterResult=()=>{if(active&&solved&&question===completedQuestion)ShopMusic.answered();};
   if(narration){
     narration.onend=resumeAfterResult;
     narration.onerror=event=>{if(event.error!=='canceled'&&event.error!=='interrupted')resumeAfterResult();};
   }else resumeAfterResult();'''
          new_result = '''   speakText(question.total+'可以分成'+question.taken+'和'+question.answer+'。',.72,true);'''
          if old_result not in s:
              raise SystemExit('Expected result narration/music resume block not found')
          s = s.replace(old_result, new_result, 1)

          old_return = " return {enter(){active=true;panel.hidden=false;if(!question)newQuestion();ShopMusic.enter();},leave(){setDrawer(false);active=false;panel.hidden=true;ShopMusic.leave();}};"
          new_return = " return {enter(){active=true;panel.hidden=false;if(!question)newQuestion();},leave(){setDrawer(false);active=false;panel.hidden=true;}};"
          if old_return not in s:
              raise SystemExit('Expected ShopSplit enter/leave music block not found')
          s = s.replace(old_return, new_return, 1)

          if 'ShopMusic' in s or 'shopMusic' in s:
              raise SystemExit('Music feature identifiers still remain in index.html')
          if 'data:image/webp;base64' in s[s.find('script id="prettyReadingScript"'):s.find('script id="prettyQuizScript"')]:
              raise SystemExit('Embedded reading WebP still remains')
          if s == original:
              raise SystemExit('No changes made')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use high-resolution reading images and remove shop music"
          git push
