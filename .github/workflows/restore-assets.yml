name: Restore GitHub Pages media assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-assets.yml'

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore home images and music from previous site version
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT="24c503575e2c7a613ee0b35ff2b9aa30ffa659ba"
          git show "${OLD_COMMIT}:index.html" > /tmp/legacy-index.html

          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('/tmp/legacy-index.html').read_text(encoding='utf-8')
          pattern = re.compile(r'data:(image/jpeg|image/png|audio/mpeg);base64,([A-Za-z0-9+/=]+)')
          matches = pattern.findall(source)

          groups = {'image/jpeg': [], 'image/png': [], 'audio/mpeg': []}
          for mime, payload in matches:
              groups[mime].append(base64.b64decode(payload))

          actual = {k: len(v) for k, v in groups.items()}
          print('Legacy embedded media counts:', actual)
          if len(groups['image/jpeg']) != 10:
              raise SystemExit(f"Expected 10 JPEG home images, found {len(groups['image/jpeg'])}")
          if len(groups['audio/mpeg']) != 1:
              raise SystemExit(f"Expected 1 MP3 file, found {len(groups['audio/mpeg'])}")

          home = Path('assets/images/home')
          audio = Path('assets/audio')
          home.mkdir(parents=True, exist_ok=True)
          audio.mkdir(parents=True, exist_ok=True)

          for i, data in enumerate(groups['image/jpeg'], 1):
              (home / f'home-{i:02d}.jpg').write_bytes(data)

          (audio / 'shop-music.mp3').write_bytes(groups['audio/mpeg'][0])
          print('Restored 10 JPEG home images and 1 MP3 file.')
          PY

      - name: Commit restored assets
        shell: bash
        run: |
          set -euo pipefail
          git add assets/images/home assets/audio
          if git diff --cached --quiet; then
            echo "Legacy assets already restored; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore home images and music for GitHub Pages"
          git push origin HEAD:main
