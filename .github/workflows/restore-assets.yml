name: Restore GitHub Pages media assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-assets.yml'

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore home images and music from previous site version
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT="24c503575e2c7a613ee0b35ff2b9aa30ffa659ba"
          git show "${OLD_COMMIT}:index.html" > /tmp/legacy-index.html

          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('/tmp/legacy-index.html').read_text(encoding='utf-8')
          pattern = re.compile(r'data:(image/jpeg|image/png|audio/mpeg);base64,([A-Za-z0-9+/=]+)')
          groups = {'image/jpeg': [], 'image/png': [], 'audio/mpeg': []}
          for mime, payload in pattern.findall(source):
              groups[mime].append(base64.b64decode(payload))

          if len(groups['image/jpeg']) != 10:
              raise SystemExit(f"Expected 10 JPEG home images, found {len(groups['image/jpeg'])}")
          if len(groups['audio/mpeg']) != 1:
              raise SystemExit(f"Expected 1 MP3 file, found {len(groups['audio/mpeg'])}")

          home = Path('assets/images/home')
          audio = Path('assets/audio')
          home.mkdir(parents=True, exist_ok=True)
          audio.mkdir(parents=True, exist_ok=True)
          for i, data in enumerate(groups['image/jpeg'], 1):
              (home / f'home-{i:02d}.jpg').write_bytes(data)
          (audio / 'shop-music.mp3').write_bytes(groups['audio/mpeg'][0])
          print('Restored 10 JPEG home images and 1 MP3 file.')
          PY

      - name: Embed the five reading images into index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          mapping = {
              'assets/images/reading/reading-01-elephant.png': '.github/reading-b64/reading-01-elephant.txt',
              'assets/images/reading/reading-02-hippo.png': '.github/reading-b64/reading-02-hippo.txt',
              'assets/images/reading/reading-03-tiger.png': '.github/reading-b64/reading-03-tiger.txt',
              'assets/images/reading/reading-04-butterfly.png': '.github/reading-b64/reading-04-butterfly.txt',
              'assets/images/reading/reading-05-smile.png': '.github/reading-b64/reading-05-smile.txt',
          }
          changed = 0
          for old_path, b64_path in mapping.items():
              if old_path in html:
                  payload = Path(b64_path).read_text(encoding='utf-8').strip()
                  html = html.replace(old_path, 'data:image/webp;base64,' + payload)
                  changed += 1
          index_path.write_text(html, encoding='utf-8')
          print(f'Embedded {changed} reading image reference(s).')
          PY

      - name: Commit repaired media references
        shell: bash
        run: |
          set -euo pipefail
          git add index.html assets/images/home assets/audio
          if git diff --cached --quiet; then
            echo "Media already repaired; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair GitHub Pages media assets"
          git push origin HEAD:main
