name: Update reading images and remove shop music

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-assets.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update reading image sources and remove shop music
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          slides = '''const slides=window.prettyLessonSlides=[
            {src:"assets/images/reading/reading-01-elephant.png",alt:"大象鼻子長"},
            {src:"assets/images/reading/reading-02-hippo.png",alt:"河馬長得壯"},
            {src:"assets/images/reading/reading-03-tiger.png",alt:"老虎毛皮黃"},
            {src:"assets/images/reading/reading-04-butterfly.png",alt:"蝴蝶花衣裳"},
            {src:"assets/images/reading/reading-05-smile.png",alt:"笑一笑好漂亮"}
          ];
          let index=0;'''

          html, count = re.subn(
              r'const slides=window\.prettyLessonSlides=\[.*?\];\nlet index=0;',
              slides,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one reading slide block, found {count}')

          html, count = re.subn(
              r'<div><div class="shop-music-controls" role="group" aria-label="背景音樂控制">.*?</div><span class="shop-tag">生活小超市</span><h2>購物分一分</h2></div>',
              '<div><span class="shop-tag">生活小超市</span><h2>購物分一分</h2></div>',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one music controls block, found {count}')

          html, count = re.subn(r'\s*<audio id="shopMusicAudio"[^>]*></audio>', '', html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one shop audio element, found {count}')

          html, count = re.subn(
              r'/\* Compact teacher music controls in the game\'s upper-left corner\. \*/.*?(?=/\* The hint uses the freed side column;)',
              '',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one music CSS block, found {count}')

          html, count = re.subn(
              r'/\* Teacher preference stays separate from the temporary narration ducking\. \*/\nconst ShopMusic=\(\(\)=>\{.*?\n\}\)\(\);\n\n(?=const ShopSplit=\(\(\)=>\{)',
              '',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one ShopMusic module, found {count}')

          html = html.replace('ShopMusic.duck();', '')

          html, count = re.subn(
              r"\n\s*const completedQuestion=question;\n\s*const narration=speakText\(question\.total\+'可以分成'\+question\.taken\+'和'\+question\.answer\+'。',\.72,true\);\n\s*const resumeAfterResult=.*?\n\s*if\(narration\)\{.*?\n\s*\}else resumeAfterResult\(\);",
              "\n   speakText(question.total+'可以分成'+question.taken+'和'+question.answer+'。',.72,true);",
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one music-resume narration block, found {count}')

          old_return = "return {enter(){active=true;panel.hidden=false;if(!question)newQuestion();ShopMusic.enter();},leave(){setDrawer(false);active=false;panel.hidden=true;ShopMusic.leave();}};"
          new_return = "return {enter(){active=true;panel.hidden=false;if(!question)newQuestion();},leave(){setDrawer(false);active=false;panel.hidden=true;}};"
          if old_return not in html:
              raise SystemExit('Expected ShopSplit enter/leave music hooks not found')
          html = html.replace(old_return, new_return, 1)

          if 'ShopMusic' in html or 'shopMusic' in html:
              raise SystemExit('Music feature identifiers still remain')

          path.write_text(html, encoding='utf-8')
          print('Updated reading images to external PNG files and removed shop music feature.')
          PY

      - name: Commit site update
        shell: bash
        run: |
          set -euo pipefail
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use high-resolution reading images and remove shop music"
          git push origin HEAD:main
