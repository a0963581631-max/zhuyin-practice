<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>襪子洗洗樂｜數到30</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#274258;background:#f3f9fc;--a:#238da1;--b:#237c68;--line:#cbdfe6;--pale:#eaf5f8}

.hero h1{font-size:clamp(24px,3vw,37px);margin:0;letter-spacing:.02em}.hero p{margin:5px 0 0;color:#4c7485}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid #bbd7df;border-radius:13px;background:white;color:#24485c;padding:10px 15px;font-weight:750;min-height:45px}.btn:hover:not(:disabled){background:#edf8fa}.btn.primary{background:#15859b;color:white;border-color:#15859b}.btn.green{background:#238668;color:white;border-color:#238668}.btn.ghost{background:#f3f9fc}.btn:active:not(:disabled){transform:scale(.98)}
.card{background:white;border:2px solid var(--line);border-radius:22px;padding:clamp(14px,2.5vw,25px);box-shadow:0 5px 22px #1d5e7020;margin-top:15px}
h2{margin:3px 0 12px;font-size:clamp(22px,2.7vw,29px)}h3{margin:0 0 10px;font-size:20px}.subtitle{color:#57788b;margin:4px 0 18px;line-height:1.6}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.setting{background:#f2fafb;border:1px solid #d9ebee;border-radius:16px;padding:13px}.setting label{display:block;font-weight:800;margin-bottom:8px}.setting select,.setting input[type=number]{width:100%;min-height:43px;border:1px solid #adcad2;border-radius:11px;padding:8px;background:white;color:#223a4b}.toggles{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.toggles label{display:inline-flex;gap:7px;align-items:center;padding:8px 12px;background:#f2fafb;border-radius:12px}.setup-footer{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:17px}
.progress{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:14px 0}.step{background:#e8f1f5;color:#516879;border-radius:11px;padding:9px 3px;text-align:center;font-size:13px;font-weight:750;line-height:1.35}.step.active{background:#1c8195;color:#fff}.step.done{background:#cdeede;color:#205d4b}
.stageTop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stageTop h2{margin:0}.pill{display:inline-flex;gap:6px;align-items:center;background:#e2f3f8;color:#16748a;border-radius:40px;font-size:15px;font-weight:850;padding:8px 13px}
.board{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.75fr);gap:15px;margin-top:15px;align-items:stretch}.scene,.info{border:2px solid #d7e8ec;border-radius:19px;padding:15px;background:#f6fbfc;min-width:0}.scene{min-height:325px}.info{background:#fff}.scene h3{color:#396579}.info p{line-height:1.65}.counter{background:#e1f1f6;border-radius:15px;padding:12px;text-align:center;font-size:21px;font-weight:900;margin-bottom:14px}.counter strong{font-size:34px;color:#076d91;font-variant-numeric:tabular-nums}.big-number{font-size:clamp(44px,9vw,74px);line-height:1.25;color:#147c96;font-weight:950;text-align:center;font-variant-numeric:tabular-nums}
.sock-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;align-content:start}.sock{border:2px solid #c6d8e5;border-radius:12px;background:white;min-height:66px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-size:31px;transition:background .1s,border-color .1s;position:relative}.sock:hover:not(:disabled){border-color:var(--a);background:#eaf8fa}.sock small{font-size:12px;font-weight:850;color:#40637a}.sock.counted,.sock.stored{background:#d9f1e7;border-color:#4da58a}.sock.selected{background:#ffefcd;border:3px solid #d89528}.sock.counted{cursor:default}
.feedback{min-height:49px;border-radius:13px;background:#eef7f9;padding:11px 13px;font-weight:750;color:#246175;line-height:1.5;margin-top:12px}.feedback.good{background:#ddf4e5;color:#236640}.feedback.warn{background:#fff0d5;color:#83570a}
.help-text{padding:12px;border-radius:13px;border:1px dashed #8cb6c3;background:#fffdf2;line-height:1.7;margin-top:10px}
.action-bar{margin-top:13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#edf6f7;border-radius:16px;padding:11px}.action-bar .push{margin-left:auto}
.choice-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}.choice{font-size:25px;min-width:72px}.choice:focus-visible{outline-offset:3px}
.tiny{font-size:14px;color:#61798a}.work-table{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.basket{border:3px solid #bda077;border-radius:14px 14px 23px 23px;background:repeating-linear-gradient(90deg,#f5deae,#f5deae 15px,#ead09b 15px,#ead09b 19px);color:#624f35;min-height:110px;min-width:112px;padding:13px 8px;text-align:center;font-weight:900}.basket.full{background:#d5e9dc;border-color:#4a9976}.basket span{display:block;font-size:30px}.basket.ready{outline:4px dashed #f0ad39;outline-offset:3px}
.pair-bay{border:2px dashed #91b6c3;background:#eaf7f9;border-radius:15px;min-height:100px;display:grid;place-items:center;padding:13px;margin:12px 0;text-align:center}.pair-bay strong{font-size:25px}
.machine-wrap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.washer{display:block;margin:8px auto;border:9px solid #acc9d5;background:linear-gradient(135deg,#fff,#d5e7f1);width:min(100%,245px);aspect-ratio:1/1.16;border-radius:27px;box-shadow:inset 0 0 0 3px #edf8fa,0 9px 18px #28516522;position:relative;cursor:pointer;padding:0}.washer:disabled{cursor:default}.washer .display{background:#17637c;color:#fff;border-radius:8px;font-size:27px;font-weight:900;padding:5px;position:absolute;left:13%;right:13%;top:7%}.washer .drum{position:absolute;left:17%;right:17%;bottom:8%;aspect-ratio:1;border-radius:50%;border:11px solid #668ba2;background:radial-gradient(circle at 28% 20%,#cfeefa,#85b5ce);display:grid;place-items:center;font-size:50px}.washer.active .drum{animation:turn .8s ease-in-out infinite alternate}@keyframes turn{to{transform:rotate(30deg)}}.washer small{position:absolute;bottom:1%;right:4%;font-weight:750;color:#345}
.tally{display:flex;gap:7px;flex-wrap:wrap}.tally .unit{padding:10px;border-radius:12px;background:#dcedf3;font-size:19px;font-weight:900}.tally .unit.ten{background:#c5ebdc;color:#20735d}
.socks-out{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:370px;margin:auto}.socks-out span{font-size:24px;text-align:center;background:white;border-radius:9px}
.closet{border:7px solid #b3ccb7;background:#e0efe1;max-width:320px;margin:auto;border-radius:16px;min-height:225px;padding:10px;box-shadow:7px 6px 0 #c4d9d4}.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:12px 4px;background:#eef6f0;border-bottom:8px solid #96b49c;border-radius:10px;min-height:80px}.shelf .slot{font-size:30px;text-align:center;display:grid;place-items:center;min-height:53px;border:1px dashed #b5cdb8;border-radius:7px}.cabinet-info{text-align:center;margin-top:9px;font-weight:800}
.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-card{min-height:165px;border:2px solid #b8dce4;border-radius:19px;background:#fff;padding:10px;text-align:center}.compare-card h3{color:#355d73}.compare-card .objects{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:220px;margin:auto}.compare-card .objects span{font-size:21px}.compare-card .numeral{font-size:66px;color:#137b92;font-weight:950}
.number-road{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:12px}.number-road button{border:1px solid #bfd8df;background:#fff;border-radius:8px;min-height:38px;padding:4px 0;font-size:16px;font-weight:850}.number-road button.passed{background:#c8eedf}.number-road button.expected{border:3px solid #2497a5;background:#e0f6fa}.road-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.road-controls select{padding:8px;border-radius:9px;border:1px solid #a9cbd5;background:white}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{background:#e9f7f5;border-radius:14px;padding:15px}.result strong{font-size:26px;color:#167a70}.result p{margin:4px 0 0;color:#547184}.report{width:100%;border-collapse:collapse;margin:12px 0}.report th,.report td{padding:9px 6px;border-bottom:1px solid #d1e5e9;text-align:left;font-size:14px}.print-only{display:none}.note{line-height:1.7;border-left:4px solid #7ab2b4;padding-left:13px}
dialog{width:min(570px,90vw);border:2px solid #add8d6;border-radius:22px;box-shadow:0 22px 60px #163b5c55;padding:25px}dialog::backdrop{background:#123e527d}
@media(max-width:710px){.board{grid-template-columns:1fr}.scene{min-height:220px}.form-grid{grid-template-columns:1fr}.progress{grid-template-columns:repeat(3,1fr)}.sock{min-height:55px;font-size:27px}.sock-grid{grid-template-columns:repeat(5,1fr)}.action-bar .push{margin-left:0}.result-grid{grid-template-columns:1fr}.number-road{grid-template-columns:repeat(5,1fr)}}@media(max-width:410px){.compare-card .objects{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:23px}.choice{font-size:21px;min-width:61px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{.hero-actions,.progress,.action-bar,#setup,.no-print{display:none!important}.card{box-shadow:none}.print-only{display:block}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div><h1>🧺 襪子洗洗樂</h1><p>數到30・一雙一雙收，十隻十隻數！</p></div><div class="hero-actions"><button class="btn" id="backBtn" type="button">← 返回單元</button><button class="btn" id="helpBtn" type="button">❔ 玩法說明</button></div></header>
<section id="setup" class="card">
<h2>老師，先設定這次的任務</h2><p class="subtitle">可以玩完整六關，也能選擇其中一關練習。所有操作皆支援直接點擊，不必拖曳。</p>
<div class="form-grid">
<div class="setting"><label for="countMode">襪子數量範圍</label><select id="countMode"><option value="30">1～30隨機</option><option value="10">1～10隨機</option><option value="20">11～20隨機</option><option value="high">21～30隨機</option><option value="custom" selected>自訂數量</option></select><label for="sockCount" style="margin-top:9px">自訂襪子數量</label><input id="sockCount" type="number" min="1" max="30" value="23"></div>
<div class="setting"><label for="mode">教學模式</label><select id="mode"><option value="guided" selected>引導操作</option><option value="demo">教師示範（可逐步或自動）</option><option value="independent">獨立挑戰</option></select><label for="hintLevel" style="margin-top:9px">預設提示程度</label><select id="hintLevel"><option value="full">完整提示</option><option value="partial" selected>部分提示</option><option value="none">不顯示提示</option></select></div>
<div class="setting"><label for="lessonMode">本次活動</label><select id="lessonMode"><option value="full" selected>完整遊戲：六關依序進行</option><option value="1">第一關｜房間找襪子</option><option value="2">第二關｜襪子配成雙</option><option value="3">第三關｜襪子洗一洗</option><option value="4">第四關｜乾淨襪子出來了</option><option value="5">第五關｜襪子收進衣櫃</option><option value="6">第六關｜誰的襪子比較多</option></select></div>
<div class="setting"><label for="speed">動畫速度</label><select id="speed"><option value="1200">慢速</option><option value="750" selected>一般</option><option value="400">快速</option></select><div class="toggles"><label><input type="checkbox" id="voice" checked> 語音朗讀</label><label><input type="checkbox" id="compareEnabled" checked> 比較挑戰</label></div></div>
</div><div class="setup-footer"><button id="resumeBtn" class="btn" type="button" hidden>繼續上一回合</button><button class="btn primary" id="startBtn" type="button">開始整理襪子 →</button></div>
</section>
<section id="play" hidden><nav class="progress" id="progress" aria-label="遊戲進度"></nav><article class="card" id="stage"></article>
<div class="action-bar"><button class="btn" type="button" id="hintBtn">💡 看提示</button><button class="btn" type="button" id="readBtn">🔊 聽說明</button><button class="btn" type="button" id="demoBtn">▶ 示範下一步</button><button class="btn" type="button" id="autoBtn">⏵ 自動示範</button><button class="btn ghost" type="button" id="restartBtn">重新開始</button><button class="btn green push" type="button" id="nextBtn" disabled>下一關 →</button></div>
<div class="feedback" id="globalFeedback" role="status" aria-live="polite">準備開始囉！</div></section>
<section id="results" class="card" hidden></section>
<dialog id="helpDialog"><h2>🧦 遊戲玩法</h2><p class="note">先把地上的襪子一隻一隻數清楚，再兩隻配一雙，五雙裝滿一籃。整籃倒入洗衣機，每籃增加10隻；剩下的襪子逐隻投入。洗好後每點一次洗衣機會排出一隻，再把襪子配對收進衣櫃，最後完成大小比較。</p><p>每一關都有「看提示」、「聽說明」、「示範下一步」。遇到單數量時，最後一隻襪子可以放入單襪暫放區，不會判錯。</p><p>數字小路可以額外練習1到30順數，或30到1倒數。口頭朗讀能力請由教師實際觀察。</p><button class="btn primary" id="closeHelp" type="button">知道了</button></dialog>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const names=['','房間找襪子','襪子配成雙','襪子洗一洗','乾淨襪子出來了','襪子收進衣櫃','誰的襪子比較多'];
const descriptions=['','找出房間有幾隻襪子，一個一個數清楚。','點兩隻襪子配成一雙，再點洗衣籃收起來。','每個滿籃有10隻，先整籃倒入，零散的逐隻放。','點一下洗衣機拿出一隻，注意剩餘數字。','兩隻乾淨襪子配成一雙，再放進衣櫃。','觀察誰比較多、比較少，或一樣多。'];
let S=null,timer=null,spoken='';
const num=(n,min,max)=>Math.min(max,Math.max(min,Math.trunc(Number(n))||min));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b};
function say(text){spoken=text;if(!$('voice').checked||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang)).sort((a,b)=>(/TW/i.test(b.lang)?1:0)-(/TW/i.test(a.lang)?1:0))[0];if(v)u.voice=v;u.lang=v?v.lang:'zh-TW';u.rate=.78;speechSynthesis.speak(u)}
function notice(text,kind=''){const node=$('globalFeedback');node.textContent=text;node.className='feedback '+kind;spoken=text}
function settingsN(){const v=$('countMode').value;if(v==='custom')return num($('sockCount').value,1,30);const low=v==='20'?11:v==='high'?21:1,high=v==='high'?30:Number(v);return low+Math.floor(Math.random()*(high-low+1))}
function makeQuestions(){const max=S.maxCompare;const rand=(min,hi)=>min+Math.floor(Math.random()*Math.max(1,hi-min+1));const q=[];q.push({a:rand(1,Math.min(8,max)),b:rand(Math.min(9,max),max),kind:'objects'});const equal=rand(1,max);q.push({a:equal,b:equal,kind:'objects'});let a=rand(1,max),b=rand(1,max);if(a===b)b=a===max?Math.max(1,a-1):a+1;q.push({a,b,kind:'numbers'});a=rand(Math.max(1,max-9),max);b=rand(1,Math.max(1,max-10));q.push({a,b,kind:'numbers'});a=rand(1,max);q.push({a,b:a,kind:'numbers'});a=rand(1,max);b=a===max?a-1:a+1;if(b<1)b=1;q.push({a,b,kind:'objects'});return q.map(x=>({...x,answer:x.a===x.b?'equal':x.a>x.b?'left':'right'}))}
function newState(){
const n=settingsN(),single=$('lessonMode').value,mode=$('mode').value;
S={N:n,phase:single==='full'?1:Number(single),single:single!=='full',enableCompare:$('compareEnabled').checked,mode,hintLevel:$('hintLevel').value,
counted:new Set(),firstDone:false,chosen:new Set(),selected:[],packedPairs:0,
basketsLoaded:0,looseLoaded:0,unloaded:0,closetChosen:new Set(),closetPairs:0,
questions:[],qIndex:0,qAnswered:false,answers:[],mistakes:{},hints:{},actions:{},
roadOpen:false,roadNext:1,roadStart:1,roadBackOpen:false,reverseNext:30,reverseStart:30,forwardPass:false,reversePass:false,
showHint:false,completed:new Set(),maxCompare:$('countMode').value==='10'?10:$('countMode').value==='20'?20:30};
S.questions=makeQuestions();if(mode==='demo')S.showHint=true;stopAuto();
}
function increment(obj,k){obj[k]=(obj[k]||0)+1}
function correct(){if(!S)return false;switch(S.phase){
case 1:return S.firstDone;
case 2:return S.packedPairs===Math.floor(S.N/2);
case 3:return S.basketsLoaded*10+S.looseLoaded===S.N;
case 4:return S.unloaded===S.N;
case 5:return S.closetPairs===Math.floor(S.N/2);
case 6:return S.qIndex===S.questions.length;
default:return false;
}}
function effectiveHint(){return S.showHint||S.hintLevel==='full'||(S.hintLevel==='partial'&&S.mode!=='independent')}
function badge(text){return '<span class="pill">'+text+'</span>'}
function soc(id,kind){return '<button type="button" class="sock '+(kind||'')+'" data-action="sock" data-id="'+id+'" aria-label="襪子'+(id+1)+'">🧦'+(S.phase===1&&S.counted.has(id)?'<small>'+(S.countedOrder.get(id))+'</small>':'')+'</button>'}
function sockPool(used,selected){let out='';for(let i=0;i<S.N;i++)if(!used.has(i))out+=soc(i,selected.includes(i)?'selected':'');return out||'<p class="tiny">襪子都整理好了！</p>'}
function icons(n){return Array.from({length:n},()=>'<span>🧦</span>').join('')}
function neededNumbers(count){const a=new Set([count]);for(let k=1;k<=12&&a.size<3;k++){if(count-k>=1)a.add(count-k);if(count+k<=30)a.add(count+k)}return shuffle([...a])}
function renderRoad(back){
const start=back?S.reverseStart:S.roadStart,next=back?S.reverseNext:S.roadNext,passed=back?next<start:next>start;
let cells='';for(let i=1;i<=30;i++){const done=back?i>next&&i<=start:i<next&&i>=start;cells+='<button type="button" data-action="'+(back?'backNum':'forwardNum')+'" data-id="'+i+'" class="'+(done?'passed':i===next?'expected':'')+'">'+i+'</button>'}
return '<div class="help-text"><strong>'+(back?'倒數數字路：從指定數字倒數到1':'順數數字路：從指定數字順數到30')+'</strong><div class="road-controls"><label>起點 <select data-change="'+(back?'reverseStart':'forwardStart')+'">'+(back?[30,20,10]:[1,11,21]).map(i=>'<option '+(start===i?'selected':'')+' value="'+i+'">'+i+'</option>').join('')+'</select></label><span class="tiny">'+(back?(next===0?'已經倒數到1！':'下一個：'+next):(next===31?'已經順數到30！':'下一個：'+next))+'</span></div><div class="number-road">'+cells+'</div></div>';
}
function render1(){
if(!S.countedOrder)S.countedOrder=new Map();
const c=S.counted.size,h=effectiveHint();
let right='<div class="counter">已數襪子：<strong>'+c+'</strong>／'+S.N+' 隻</div>';
right+='<p>一隻一隻點地板上的襪子。數過的襪子會留下標記。</p>';
if(c===S.N){right+='<h3>一共有幾隻襪子？</h3><div class="choice-row">'+neededNumbers(S.N).map(n=>'<button class="btn choice" data-action="answerTotal" data-id="'+n+'">'+n+'</button>').join('')+'</div>'+(S.firstDone?'<p class="feedback good">答對了！一共有'+S.N+'隻。</p>':'')}
else if(h)right+='<div class="help-text">提示：點一隻，唸出下一個數字；最後唸到的數字就是總量。</div>';
right+='<button class="btn" data-action="toggleRoad">🔢 '+(S.roadOpen?'收起':'展開')+'順數數字路（1～30）</button>';
if(S.roadOpen)right+=renderRoad(false);
return '<div class="board"><div class="scene"><h3>🏠 房間地板</h3><div class="sock-grid">'+Array.from({length:S.N},(_,i)=>soc(i,S.counted.has(i)?'counted':'')).join('')+'</div></div><div class="info">'+right+'</div></div>';
}
function render2(){
const pairs=Math.floor(S.N/2),usedCount=S.packedPairs*2,remaining=S.N-usedCount,complete=Math.floor(S.packedPairs/5),partial=S.packedPairs%5,selected=S.selected;
let main='<div class="counter">已配好 <strong>'+S.packedPairs+'</strong> 雙（'+usedCount+'隻）</div>';
main+='<div class="sock-grid">'+sockPool(S.chosen,selected)+'</div>';
main+='<div class="pair-bay">'+(selected.length===2?'<strong>🧦＋🧦＝1雙</strong><div>點右側洗衣籃，把這一雙收起來</div>':selected.length===1?'已選1隻，再選另外1隻':'請先點選兩隻襪子')+'</div>';
let bs='<div class="work-table">'+Array.from({length:complete},(_,i)=>'<div class="basket full" aria-label="裝滿10隻的籃子"><span>🧺</span>第'+(i+1)+'籃<br>5雙＝10隻 ✓</div>').join('');
if(remaining>1||partial>0)bs+='<button class="basket '+(selected.length===2?'ready':'')+'" type="button" data-action="pack"><span>🧺</span>整理中<br>'+partial+'／5雙</button>';
bs+='</div>';
let info='<div class="counter">完整籃子 <strong>'+complete+'</strong> 籃</div><p>每放進一雙，就一起數：<strong>'+Array.from({length:partial},(_,i)=>(complete*10+(i+1)*2)).join('、')+'</strong></p>'+bs;
info+='<p class="tiny">未滿10隻的'+(partial*2+(S.N%2))+'隻襪子，下一關要逐隻投入洗衣機。</p>';
if(effectiveHint())info+='<div class="help-text">提示：點選兩隻，完成一雙；再按「整理中」洗衣籃放入。每籃五雙就是10隻。</div>';
if(pairs===0)info+='<p>只有1隻襪子，無法配成一雙，可直接進下一關。</p>';
if(correct())info+='<p class="feedback good">配對完成！'+complete+'個滿籃，剩下'+(S.N%10)+'隻零散襪子。</p>';
return '<div class="board"><div class="scene"><h3>🧦 待整理襪子（剩'+remaining+'隻）</h3>'+main+'</div><div class="info">'+info+'</div></div>';
}
function machine(canClick,label){return '<button type="button" class="washer '+(S.phase===4?'active':'')+'" '+(canClick?'data-action="'+(S.phase===4?'unload':'')+'"':'disabled')+' aria-label="'+label+'"><span class="display">'+label+'</span><span class="drum">🧦</span><small>洗衣機</small></button>'}
function render3(){
const total=S.basketsLoaded*10+S.looseLoaded,all=Math.floor(S.N/10),loose=S.N%10,remain=all-S.basketsLoaded,looseRemain=loose-S.looseLoaded;
let info='<div class="counter">目前放入：<strong>'+total+'</strong>隻</div><div class="tally">'+Array.from({length:S.basketsLoaded},()=>'<span class="unit ten">10</span>').join('')+(S.looseLoaded?'<span class="unit">＋'+S.looseLoaded+'</span>':'')+'</div><p><strong>'+S.basketsLoaded+'個十＋'+S.looseLoaded+'個一＝'+total+'</strong></p>';
if(effectiveHint())info+='<div class="help-text">先倒裝滿10隻的籃子，每次加10；全部倒完後，再一隻一隻放零散襪子。</div>';
return '<div class="board"><div class="scene"><h3>🫧 洗衣機</h3>'+machine(false,total+' 隻')+'<p style="text-align:center;font-weight:800">共要洗 '+S.N+' 隻</p></div><div class="info">'+info+'<h3>🧺 準備投入</h3><div class="work-table">'+Array.from({length:remain},(_,i)=>'<button class="basket" data-action="loadBasket"><span>🧺</span>10隻<br>整籃倒入</button>').join('')+'</div><h3 style="margin-top:14px">零散襪子：'+looseRemain+'隻</h3><div class="sock-grid">'+Array.from({length:looseRemain},(_,i)=>'<button class="sock" data-action="loadLoose" '+(remain?'disabled title="先投入滿籃"':'')+'>🧦</button>').join('')+'</div>'+(correct()?'<p class="feedback good">全部 '+S.N+' 隻已經放進洗衣機！</p>':'')+'</div></div>';
}
function render4(){
const rem=S.N-S.unloaded,clean=S.unloaded;
const right='<div class="counter">洗衣機剩下 <strong>'+rem+'</strong> 隻</div><div class="counter" style="background:#e4f5e8">已洗好 <strong>'+clean+'</strong> 隻</div><p>按一下洗衣機，就會拿出一隻乾淨襪子。<strong>每次少1</strong>，一起倒著數。</p><button class="btn" data-action="toggleReverse">🔢 '+(S.roadBackOpen?'收起':'展開')+'倒數數字路（30～1）</button>'+(S.roadBackOpen?renderRoad(true):'')+(effectiveHint()?'<div class="help-text">例如剩23隻，拿出1隻後是22隻；接著21、20、19……直到0。</div>':'');
return '<div class="board"><div class="scene"><h3>🫧 洗好的襪子</h3>'+machine(rem>0,'剩 '+rem+' 隻')+'<h3>🧺 收集區：'+clean+'隻</h3><div class="socks-out">'+icons(clean)+'</div></div><div class="info">'+right+'</div></div>';
}
function render5(){
const pairMax=Math.floor(S.N/2),stored=S.closetPairs*2,full=Math.floor(S.closetPairs/5),partial=S.closetPairs%5;
let closets=Array.from({length:full},(_,j)=>'<div class="closet"><div class="shelf">'+Array.from({length:5},()=>'<div class="slot">🧦</div>').join('')+'</div><p class="cabinet-info">第'+(j+1)+'櫃｜10隻 ✓</p></div>').join('');
if(S.closetPairs<pairMax||partial)closets+='<button type="button" class="closet" style="cursor:pointer" data-action="store" aria-label="把這一雙放入衣櫃"><div class="shelf">'+Array.from({length:5},(_,i)=>'<div class="slot">'+(i<partial?'🧦':'＋')+'</div>').join('')+'</div><p class="cabinet-info">整理中 '+partial+'／5雙｜點這裡收納</p></button>';
let info='<div class="counter">衣櫃已收 <strong>'+stored+'</strong> 隻</div><div class="work-table">'+closets+'</div>';
if(correct()){info+='<p class="feedback good">整理完成：'+full+'個滿櫃＋'+(S.N%10)+'隻不足10的襪子。</p>';if(S.N%2)info+='<p>另外1隻單襪放在暫放區，不需要配對。</p>';}
if(effectiveHint())info+='<div class="help-text">點兩隻配一雙，接著點衣櫃收納。五雙放滿一櫃，剛好10隻。</div>';
return '<div class="board"><div class="scene"><h3>🧦 乾淨襪子待收區</h3><div class="counter">還有 <strong>'+(S.N-stored)+'</strong>隻</div><div class="sock-grid">'+sockPool(S.closetChosen,S.selected)+'</div><div class="pair-bay">'+(S.selected.length===2?'<strong>🧦＋🧦＝1雙</strong><div>點右邊的衣櫃收好</div>':S.selected.length===1?'再挑一隻襪子':'點兩隻襪子配成一雙')+'</div></div><div class="info"><h3>🚪 整理衣櫃</h3>'+info+'</div></div>';
}
function render6(){
const i=S.qIndex,q=S.questions[i];if(!q)return '<div class="feedback good">六題完成！</div>';
const thing=(n,title)=>'<div class="compare-card"><h3>'+title+'</h3>'+(q.kind==='numbers'?'<div class="numeral">'+n+'</div>':'<div class="objects">'+icons(n)+'</div>')+'</div>';
let info='<div class="counter">第 <strong>'+(i+1)+'</strong>／'+S.questions.length+' 題</div><h3>哪邊比較多（數字比較大）？</h3><div class="choice-row"><button class="btn" data-action="compare" data-id="left">左邊</button><button class="btn" data-action="compare" data-id="right">右邊</button><button class="btn" data-action="compare" data-id="equal">一樣多</button></div>';
if(effectiveHint())info+='<div class="help-text">'+(q.kind==='numbers'?'提示：可以想想哪個數字在數字路上比較後面。':'提示：可以一隻對一隻配對，看看有沒有剩下。')+'</div>';
return '<div class="board"><div class="scene"><h3>🧦 比較挑戰（'+(q.kind==='objects'?'看襪子':'看數字')+'）</h3><div class="compareGrid">'+thing(q.a,'左邊')+thing(q.b,'右邊')+'</div></div><div class="info">'+info+'</div></div>';
}
function render(){
if(!S)return;let html='<div class="stageTop"><div><p class="tiny">第 '+S.phase+' 關／共 '+(S.enableCompare?6:5)+' 關</p><h2>'+names[S.phase]+'</h2></div>'+badge('🧦 '+S.N+'隻襪子')+'</div><p class="subtitle">'+descriptions[S.phase]+'</p>';
html+=({1:render1,2:render2,3:render3,4:render4,5:render5,6:render6}[S.phase])();
$('stage').innerHTML=html;
$('progress').innerHTML=names.slice(1,S.enableCompare?7:6).map((name,i)=>'<div class="step '+(i+1===S.phase?'active':S.completed.has(i+1)?'done':'')+'">'+(i+1)+'. '+name+'</div>').join('');
$('nextBtn').disabled=!correct();$('nextBtn').textContent=S.single||S.phase===6||(S.phase===5&&!S.enableCompare)?'查看學習紀錄 →':'下一關 →';
$('demoBtn').hidden=S.mode==='independent';$('autoBtn').hidden=S.mode==='independent';
$('autoBtn').textContent=timer?'Ⅱ 暫停示範':'⏵ 自動示範';
}
function goStage(next){stopAuto();S.completed.add(S.phase);S.phase=next;S.showHint=S.mode==='demo';S.selected=[];S.roadOpen=false;S.roadBackOpen=false;render();notice('進入'+names[next]+'。');say(descriptions[next]);window.scrollTo({top:0,behavior:'smooth'})}
function finishStage(){if(!correct())return;stopAuto();S.completed.add(S.phase);if(S.single||S.phase===6||(S.phase===5&&!S.enableCompare)){results();return;}goStage(S.phase+1)}
function mistake(msg){increment(S.mistakes,S.phase);notice(msg,'warn');say(msg)}
function act(action,id){
if(!S)return;const phase=S.phase,k=Number(id);
if(action==='sock'){
if(phase===1){if(S.counted.has(k)){notice('這隻已經數過了，找另一隻。');return;}S.counted.add(k);S.countedOrder.set(k,S.counted.size);increment(S.actions,phase);say(String(S.counted.size));notice('數到 '+S.counted.size+' 隻。','good');}
else if(phase===2||phase===5){const used=phase===2?S.chosen:S.closetChosen;if(used.has(k))return;if(S.selected.includes(k))S.selected=S.selected.filter(x=>x!==k);else if(S.selected.length<2)S.selected.push(k);else{notice('已經選了兩隻，先把一雙收好。');return;}notice(S.selected.length===2?'配成一雙了！接著點籃子或衣櫃。':'已選'+S.selected.length+'隻襪子。');if(S.selected.length===2)say('一雙，兩隻');}
}else if(action==='answerTotal'&&phase===1){if(k===S.N){S.firstDone=true;increment(S.actions,1);say('答對了！一共有'+S.N+'隻襪子');notice('答對！共 '+S.N+' 隻。','good');}else mistake('再數數看，最後唸到的數字就是總數。');}
else if(action==='pack'&&phase===2){if(S.selected.length!==2){mistake('請先選兩隻襪子，配成一雙。');return;}for(const i of S.selected)S.chosen.add(i);S.selected=[];S.packedPairs++;increment(S.actions,2);const subtotal=S.packedPairs*2;say(String(subtotal));notice('已配好'+S.packedPairs+'雙，共'+subtotal+'隻。'+(S.packedPairs%5===0?'五雙就是10隻，這一籃滿了！':''),'good');}
else if(action==='loadBasket'&&phase===3){if(S.basketsLoaded>=Math.floor(S.N/10))return;S.basketsLoaded++;increment(S.actions,3);const total=S.basketsLoaded*10+S.looseLoaded;say(String(total));notice('倒入10隻，現在有'+total+'隻。','good');}
else if(action==='loadLoose'&&phase===3){if(S.basketsLoaded<Math.floor(S.N/10)){mistake('先把裝滿10隻的籃子倒進去。');return;}if(S.looseLoaded>=S.N%10)return;S.looseLoaded++;increment(S.actions,3);const total=S.basketsLoaded*10+S.looseLoaded;say(String(total));notice('放進一隻，現在有'+total+'隻。','good');}
else if(action==='unload'&&phase===4){if(S.unloaded>=S.N)return;S.unloaded++;increment(S.actions,4);const remaining=S.N-S.unloaded;say(remaining?'剩下'+remaining+'隻':'剩下零隻，洗衣機空了');notice('拿出1隻，洗衣機還剩'+remaining+'隻。','good');}
else if(action==='store'&&phase===5){if(S.selected.length!==2){mistake('請先點選兩隻乾淨襪子。');return;}for(const i of S.selected)S.closetChosen.add(i);S.selected=[];S.closetPairs++;increment(S.actions,5);const n=S.closetPairs*2;say(String(n));notice('衣櫃已收好'+n+'隻。'+(S.closetPairs%5===0?'五雙裝滿一櫃，共10隻！':''),'good');}
else if(action==='compare'&&phase===6){const q=S.questions[S.qIndex];if(!q)return;const right=id===q.answer;if(!S.qAnswered){S.answers.push({q:S.qIndex,first:right,assisted:(S.hints[6]||0)>0||S.mode==='demo'});S.qAnswered=true;}if(!right){mistake('再看看哪邊比較多。也可能一樣多喔。');}else{increment(S.actions,6);notice('答對了！'+q.a+' 和 '+q.b+'，'+(q.answer==='equal'?'一樣多。':q.a>q.b?'左邊比較多。':'右邊比較多。'),'good');say('答對了！');S.qIndex++;S.qAnswered=false;}}
else if(action==='toggleRoad'){S.roadOpen=!S.roadOpen;S.showHint=true;}
else if(action==='toggleReverse'){S.roadBackOpen=!S.roadBackOpen;S.showHint=true;}
else if(action==='forwardNum'){if(k!==S.roadNext){mistake('請依照順序找下一個數字。');return;}S.roadNext++;if(S.roadNext===31){S.forwardPass=true;notice('太棒了！你走完1到30的數字路。','good');}say(String(k));}
else if(action==='backNum'){if(k!==S.reverseNext){mistake('請找前一個數字，一個一個倒著數。');return;}S.reverseNext--;if(S.reverseNext===0){S.reversePass=true;notice('太棒了！你完成倒數數字路。','good');}say(String(k));}
render();
}
function showHint(){if(!S)return;increment(S.hints,S.phase);S.showHint=true;render();notice('已顯示本關的操作提示。')}
function demoStep(){
if(!S||correct()){stopAuto();return;}
const phase=S.phase;
if(phase===1){const next=Array.from({length:S.N},(_,i)=>i).find(i=>!S.counted.has(i));if(next!==undefined)act('sock',next);else act('answerTotal',S.N);}
if(phase===2||phase===5){const used=phase===2?S.chosen:S.closetChosen;if(S.selected.length<2){const next=Array.from({length:S.N},(_,i)=>i).find(i=>!used.has(i)&&!S.selected.includes(i));if(next!==undefined)act('sock',next);}else act(phase===2?'pack':'store');}
if(phase===3){act(S.basketsLoaded<Math.floor(S.N/10)?'loadBasket':'loadLoose');}
if(phase===4)act('unload');
if(phase===6){const q=S.questions[S.qIndex];if(q)act('compare',q.answer);}
if(correct())stopAuto();
}
function stopAuto(){if(timer!==null){clearInterval(timer);timer=null;}if($('autoBtn'))$('autoBtn').textContent='⏵ 自動示範'}
function results(){
stopAuto();$('play').hidden=true;$('results').hidden=false;$('setup').hidden=true;
const finished=[...S.completed].sort((a,b)=>a-b),answerCorrect=S.answers.filter(x=>x.first&&!x.assisted).length;
let tbl='<table class="report"><thead><tr><th>活動</th><th>完成操作</th><th>需要提示</th><th>錯誤嘗試</th></tr></thead><tbody>';
for(const p of finished)tbl+='<tr><td>'+names[p]+'</td><td>'+(S.actions[p]||0)+'</td><td>'+(S.hints[p]||0)+'</td><td>'+(S.mistakes[p]||0)+'</td></tr>';
tbl+='</tbody></table>';
$('results').innerHTML='<h2>🎉 襪子整理完成！</h2><p class="subtitle">這一回合整理了 '+S.N+' 隻襪子，謝謝你幫忙完成任務！</p><div class="result-grid"><div class="result"><strong>'+S.N+'</strong><p>本回合襪子數</p></div><div class="result"><strong>'+Math.floor(S.N/2)+'</strong><p>可配成的完整雙數</p></div><div class="result"><strong>'+Math.floor(S.N/10)+'</strong><p>每10隻為一組的組數</p></div></div><h3 style="margin-top:20px">教師觀察與操作紀錄</h3>'+tbl+'<p class="tiny">數字路：順數'+(S.forwardPass?'已完成':'尚未完整檢核')+'；倒數'+(S.reversePass?'已完成':'尚未完整檢核')+'。比較挑戰第一次未求助即答對：'+answerCorrect+'／'+S.answers.length+'題。點擊操作不代表已確認口語數數能力。</p><div class="setting"><strong>教師口語觀察（可自行勾選）</strong><div class="toggles"><label><input type="checkbox"> 能獨立順數</label><label><input type="checkbox"> 能獨立倒數</label><label><input type="checkbox"> 能以2個一數</label><label><input type="checkbox"> 能以10個一數</label></div></div><p class="note">紀錄僅顯示本次頁面的操作狀況，不保存學生姓名或個人資料。示範模式與使用提示後的作答，不應視為獨立掌握。</p><div class="setup-footer no-print"><button class="btn" id="printResults" type="button">列印本次紀錄</button><button class="btn" id="sameGame" type="button">相同數量重玩</button><button class="btn primary" id="newGame" type="button">重新選擇活動</button></div>';
$('printResults').onclick=()=>window.print();$('newGame').onclick=backSetup;$('sameGame').onclick=()=>{$('countMode').value='custom';$('sockCount').value=S.N;start()};
window.scrollTo({top:0,behavior:'smooth'});
}
function backSetup(){stopAuto();if('speechSynthesis' in window)speechSynthesis.cancel();$('play').hidden=true;$('results').hidden=true;$('setup').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function start(){newState();S.countedOrder=new Map();$('setup').hidden=true;$('results').hidden=true;$('play').hidden=false;render();notice('請開始：'+descriptions[S.phase]);say(descriptions[S.phase]);window.scrollTo({top:0,behavior:'smooth'})}
$('stage').addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(el&&!el.disabled)act(el.dataset.action,el.dataset.id)});
$('stage').addEventListener('change',e=>{const kind=e.target.dataset.change;if(!kind||!S)return;const n=Number(e.target.value);if(kind==='forwardStart'){S.roadStart=n;S.roadNext=n;S.forwardPass=false;}if(kind==='reverseStart'){S.reverseStart=n;S.reverseNext=n;S.reversePass=false;}render()});
$('countMode').onchange=()=>{$('sockCount').disabled=$('countMode').value!=='custom'};
$('startBtn').onclick=start;$('nextBtn').onclick=finishStage;$('hintBtn').onclick=showHint;$('readBtn').onclick=()=>say(descriptions[S.phase]);$('demoBtn').onclick=()=>{if(S){increment(S.hints,S.phase);S.showHint=true;demoStep();}};
$('autoBtn').onclick=()=>{if(!S)return;if(timer){stopAuto();render();return;}increment(S.hints,S.phase);S.showHint=true;timer=setInterval(demoStep,Number($('speed').value));render();};
$('restartBtn').onclick=()=>{if(confirm('確定重新設定本次遊戲嗎？目前的進度將清除。'))backSetup()};
$('helpBtn').onclick=()=>$('helpDialog').showModal();$('closeHelp').onclick=()=>$('helpDialog').close();
$('backBtn').onclick=()=>{stopAuto();if(window.parent&&window.parent!==window){window.parent.location.hash='#math-1';}else window.location.href='index.html#math-1';};
window.addEventListener('pagehide',()=>{stopAuto();if('speechSynthesis' in window)speechSynthesis.cancel()});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='sockGamePause'){stopAuto();if('speechSynthesis' in window)speechSynthesis.cancel()}});
})();
</script>
</body></html>
